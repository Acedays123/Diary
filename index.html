<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Персональный Электронный Дневник</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --subtext: #6c757d;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e2e8f0;
      --radius: 14px;
      --danger: #ef4444;

      /* Цвета сезонов */
      --winter-bg: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      --spring-bg: linear-gradient(135deg, #dcfce7 0%, #86efac 100%);
      --summer-bg: linear-gradient(135deg, #fef9c3 0%, #fde047 100%);
      --autumn-bg: linear-gradient(135deg, #ffedd5 0%, #fdba74 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    
    .app { width: 100%; max-width: 1280px; display: flex; flex-direction: column; gap: 16px; }

    /* Переключатель Главных Режимов */
    .mode-bar { display: flex; background: #e2e8f0; padding: 4px; border-radius: 12px; max-width: 400px; margin: 0 auto; width: 100%; }
    .mode-btn { flex: 1; padding: 8px 16px; border: none; background: transparent; font-weight: 600; font-size: 13px; color: var(--subtext); border-radius: 9px; cursor: pointer; transition: 0.2s; text-align: center; }
    .mode-btn.active { background: #ffffff; color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

    /* Шапка с навигатором бесконечного года */
    .year-nav-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .year-title { font-size: 22px; font-weight: 800; color: var(--primary); }

    .search-input { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; width: 260px; outline: none; }
    .search-input:focus { border-color: var(--primary); }

    /* Двупанельная структура */
    .layout-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
    .panel { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }

    /* Сезонная Сетка (4 столбика по 3 месяца) */
    .seasons-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .season-column { display: flex; flex-direction: column; gap: 10px; }
    .season-header { font-size: 13px; font-weight: 700; text-align: center; padding: 6px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .season-winter { background: var(--winter-bg); color: #0369a1; }
    .season-spring { background: var(--spring-bg); color: #15803d; }
    .season-summer { background: var(--summer-bg); color: #a16207; }
    .season-autumn { background: var(--autumn-bg); color: #c2410c; }

    .month-card { min-height: 75px; background: #ffffff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .month-card:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

    /* Сетка дней внутри месяца */
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .day-head { font-size: 11px; font-weight: 700; color: var(--subtext); padding-bottom: 4px; }
    .day-card { min-height: 48px; background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 4px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .day-card:hover { border-color: var(--primary); transform: scale(1.03); }
    .day-card.active-day { outline: 2px solid var(--primary); }

    .fill-label { font-size: 9px; font-weight: 800; background: rgba(0,0,0,0.3); color: white; padding: 1px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Вкладки дней для Шаблонов */
    .template-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 15px; }
    .t-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .t-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Карточка Урока */
    .lesson-row { display: grid; grid-template-columns: 24px 1fr 1fr 60px 28px; gap: 6px; align-items: center; margin-bottom: 8px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { height: 90px; resize: none; margin-top: 6px; }

    .btn { padding: 8px 14px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); padding: 4px; }

    /* Легенда (Сноски) */
    .legend-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .legend-tag { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 12px; font-size: 11px; color: white; font-weight: 700; }

    .selected-highlight { outline: 3px solid var(--primary) !important; }

    @media (max-width: 900px) {
      .seasons-grid { grid-template-columns: repeat(2, 1fr); }
      .layout-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Переключатель Режимов -->
  <div class="mode-bar">
    <button class="mode-btn active" id="btnModeCalendar" onclick="switchMainMode('calendar')">📅 Дневник и Года</button>
    <button class="mode-btn" id="btnModeTemplate" onclick="switchMainMode('template')">⚙️ Шаблон Недели</button>
  </div>

  <!-- Панель бесконечного года -->
  <div class="year-nav-bar" id="yearNavBar">
    <button class="btn" onclick="changeYear(-1)">← Прошлый год</button>
    <div class="year-title" id="displayYearTitle">2026 Год</div>
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по названию, предмету..." oninput="handleSearch()">
    <button class="btn" onclick="changeYear(1)">Следующий год →</button>
  </div>

  <!-- Двупанельный Блок -->
  <div class="layout-grid">
    
    <!-- Левая панель: Календарь -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="leftPanelTitle">Сезоны года</h3>
        <button class="btn" id="btnFill" style="font-size:11px; padding:4px 8px;" onclick="colorizeSelected()">🎨 Заливка цвет/сноска</button>
      </div>

      <!-- Вид 12 месяцев по сезонам -->
      <div id="seasonsView" class="seasons-grid"></div>

      <!-- Вид Дней месяца -->
      <div id="daysView" class="days-grid" style="display:none;"></div>

      <!-- Сноски (Легенда) -->
      <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
        <h4 style="font-size:12px; color:var(--subtext);">🏷️ Ваши сноски и цвета:</h4>
        <div class="legend-bar" id="legendContainer"></div>
      </div>
    </div>

    <!-- Правая панель: Просмотр дня / Редактор шаблона -->
    <div class="panel">
      <!-- Режим Дневника -->
      <div id="rightDayView">
        <h3 id="rightPanelTitle" style="margin-bottom:12px;">Выберите день</h3>
        
        <div id="dayDetailContent" style="display:none;">
          <h4>📚 Расписание уроков</h4>
          <div id="lessonsList" style="margin-top:8px;"></div>
          <button class="btn" style="width:100%; margin-top:8px;" onclick="addLesson()">+ Добавить урок</button>

          <h4 style="margin-top:14px;">📝 Заметки дня</h4>
          <textarea id="dayNotes" placeholder="Напишите важное..." oninput="saveNotes()"></textarea>

          <!-- Успеваемость -->
          <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h4>📊 Успеваемость</h4>
              <span style="font-weight:700;">Общий балл: <b id="totalAvg">0.00</b></span>
            </div>
            <div id="subjectStats" style="font-size:12px; margin-top:6px;"></div>
          </div>
        </div>

        <div id="searchResults" style="display:none;"></div>
      </div>

      <!-- Режим Редактирования Шаблона -->
      <div id="rightTemplateView" style="display:none;">
        <h3 style="margin-bottom:10px;">Настройка Базовой Недели</h3>
        <p style="font-size:12px; color:var(--subtext); margin-bottom:12px;">Укажите стандартные уроки для каждого дня недели:</p>
        
        <div class="template-tabs">
          <button class="t-btn active" onclick="selectTemplateDay(1)">Пн</button>
          <button class="t-btn" onclick="selectTemplateDay(2)">Вт</button>
          <button class="t-btn" onclick="selectTemplateDay(3)">Ср</button>
          <button class="t-btn" onclick="selectTemplateDay(4)">Чт</button>
          <button class="t-btn" onclick="selectTemplateDay(5)">Пт</button>
          <button class="t-btn" onclick="selectTemplateDay(6)">Сб</button>
          <button class="t-btn" onclick="selectTemplateDay(0)">Вс</button>
        </div>

        <div id="templateLessonsList"></div>
        <button class="btn" style="width:100%; margin-top:8px;" onclick="addTemplateLesson()">+ Добавить урок в шаблон</button>
      </div>
    </div>

  </div>

  <!-- Резервное копирование -->
  <div style="display:flex; justify-content:flex-end; gap:8px;">
    <button class="btn" style="background:#6c757d; font-size:11px;" onclick="exportData()">💾 Сохранить бэкап</button>
    <button class="btn" style="background:#6c757d; font-size:11px;" onclick="importData()">📂 Загрузить бэкап</button>
    <input type="file" id="importInput" style="display:none" onchange="processImport(event)">
  </div>

</div>

<script>
  let activeYear = 2026;
  let activeMonth = 8; // Сентябрь
  let activeDay = 22;
  let viewMode = 'seasons'; // 'seasons' или 'days'
  let mainMode = 'calendar'; // 'calendar' или 'template'
  let selectedTemplateDay = 1;

  let selectedItems = new Set();
  let isDragging = false;

  let db = JSON.parse(localStorage.getItem('my_ultimate_diary_v4')) || {
    template: { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 0: [] },
    months: {}, 
    days: {},   
    lessons: {},
    notes: {},  
    legend: {}  
  };

  const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  const dayHeaders = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  document.addEventListener('mouseup', () => isDragging = false);

  function changeYear(delta) {
    activeYear += delta;
    document.getElementById('displayYearTitle').innerText = `${activeYear} Год`;
    renderSeasons();
  }

  function switchMainMode(mode) {
    mainMode = mode;
    document.getElementById('btnModeCalendar').className = mode === 'calendar' ? 'mode-btn active' : 'mode-btn';
    document.getElementById('btnModeTemplate').className = mode === 'template' ? 'mode-btn active' : 'mode-btn';

    document.getElementById('rightDayView').style.display = mode === 'calendar' ? 'block' : 'none';
    document.getElementById('rightTemplateView').style.display = mode === 'template' ? 'block' : 'none';

    if (mode === 'template') {
      selectTemplateDay(selectedTemplateDay);
    }
  }

  /* Рендер 4 Сезонов по 3 месяца */
  function renderSeasons() {
    viewMode = 'seasons';
    selectedItems.clear();
    document.getElementById('seasonsView').style.display = 'grid';
    document.getElementById('daysView').style.display = 'none';
    document.getElementById('leftPanelTitle').innerText = `Сезоны ${activeYear} года`;

    const container = document.getElementById('seasonsView');
    container.innerHTML = '';

    const seasons = [
      { name: "❄️ Зима", class: "season-winter", months: [11, 0, 1] },
      { name: "🌱 Весна", class: "season-spring", months: [2, 3, 4] },
      { name: "☀️ Лето", class: "season-summer", months: [5, 6, 7] },
      { name: "🍂 Осень", class: "season-autumn", months: [8, 9, 10] }
    ];

    seasons.forEach(s => {
      let colHTML = `<div class="season-column"><div class="season-header ${s.class}">${s.name}</div>`;
      
      s.months.forEach(mIdx => {
        const key = `${activeYear}-${mIdx}`;
        const data = db.months[key] || {};
        const bgStyle = data.color ? `background-color: ${data.color}; color: white;` : '';

        colHTML += `
          <div class="month-card" style="${bgStyle}" onmousedown="event.preventDefault(); isDragging=true; toggleSelection(${mIdx}, this)" onmouseenter="if(isDragging) toggleSelection(${mIdx}, this)" onclick="if(!isDragging) openMonth(${mIdx})">
            <div>${monthNames[mIdx]}</div>
            ${data.label ? `<div class="fill-label">${data.label}</div>` : ''}
          </div>
        `;
      });

      colHTML += `</div>`;
      container.innerHTML += colHTML;
    });

    renderLegend();
  }

  function openMonth(mIdx) {
    activeMonth = mIdx;
    viewMode = 'days';
    selectedItems.clear();
    document.getElementById('seasonsView').style.display = 'none';
    document.getElementById('daysView').style.display = 'grid';
    document.getElementById('leftPanelTitle').innerText = `${monthNames[activeMonth]} ${activeYear}`;

    renderDays();
  }

  function renderDays() {
    const container = document.getElementById('daysView');
    container.innerHTML = '';

    dayHeaders.forEach(h => container.innerHTML += `<div class="day-head">${h}</div>`);

    const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
    const firstDayIndex = (new Date(activeYear, activeMonth, 1).getDay() + 6) % 7;

    for (let i = 0; i < firstDayIndex; i++) container.innerHTML += `<div></div>`;

    for (let day = 1; day <= daysInMonth; day++) {
      const key = `${activeYear}-${activeMonth}-${day}`;
      const data = db.days[key] || {};
      const bgStyle = data.color ? `background-color: ${data.color}; color: white;` : '';
      const isActive = (day === activeDay) ? 'active-day' : '';

      const card = document.createElement('div');
      card.className = `day-card ${isActive}`;
      card.style.cssText = bgStyle;
      card.innerHTML = `
        <span>${day}</span>
        ${data.label ? `<div class="fill-label">${data.label}</div>` : ''}
      `;

      card.onmousedown = (e) => { e.preventDefault(); isDragging = true; toggleSelection(day, card); };
      card.onmouseenter = () => { if (isDragging) toggleSelection(day, card); };
      card.onclick = () => selectDay(day);

      container.appendChild(card);
    }
  }

  function selectDay(day) {
    activeDay = day;
    document.getElementById('rightPanelTitle').innerText = `${activeYear}-${activeMonth + 1}-${day} (${monthNames[activeMonth]})`;
    document.getElementById('dayDetailContent').style.display = 'block';
    document.getElementById('searchResults').style.display = 'none';

    renderDays();
    renderDayDetails();
  }

  function renderDayDetails() {
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    let lessons = db.lessons[key];

    // Если на день нет отдельной записи, подтягиваем базовый шаблон
    if (!lessons) {
      const dayOfWeek = new Date(activeYear, activeMonth, activeDay).getDay();
      lessons = db.template[dayOfWeek] || [];
    }

    const container = document.getElementById('lessonsList');
    container.innerHTML = '';

    lessons.forEach((l, idx) => {
      container.innerHTML += `
        <div class="lesson-row">
          <span style="font-weight:700;">#${idx + 1}</span>
          <input type="text" value="${l.title || ''}" placeholder="Предмет" onchange="updateLesson(${idx}, 'title', this.value)">
          <input type="text" value="${l.info || ''}" placeholder="Кабинет/Время" onchange="updateLesson(${idx}, 'info', this.value)">
          <input type="text" value="${l.mark || ''}" placeholder="Оценка" onchange="updateLesson(${idx}, 'mark', this.value)">
          <button class="btn btn-danger" onclick="deleteLesson(${idx})">✕</button>
        </div>
      `;
    });

    document.getElementById('dayNotes').value = db.notes[key] || '';
    calculateStats();
  }

  /* РЕЖИМ ШАБЛОНА */
  function selectTemplateDay(dNum) {
    selectedTemplateDay = dNum;
    const buttons = document.querySelectorAll('.t-btn');
    const order = [1, 2, 3, 4, 5, 6, 0];
    buttons.forEach((btn, idx) => btn.className = order[idx] === dNum ? 't-btn active' : 't-btn');

    renderTemplateLessons();
  }

  function renderTemplateLessons() {
    const container = document.getElementById('templateLessonsList');
    container.innerHTML = '';
    const lessons = db.template[selectedTemplateDay] || [];

    lessons.forEach((l, idx) => {
      container.innerHTML += `
        <div class="lesson-row">
          <span style="font-weight:700;">#${idx + 1}</span>
          <input type="text" value="${l.title || ''}" placeholder="Предмет" onchange="updateTemplateLesson(${idx}, 'title', this.value)">
          <input type="text" value="${l.info || ''}" placeholder="Время" onchange="updateTemplateLesson(${idx}, 'info', this.value)">
          <input type="text" value="" disabled placeholder="---">
          <button class="btn btn-danger" onclick="deleteTemplateLesson(${idx})">✕</button>
        </div>
      `;
    });
  }

  function addTemplateLesson() {
    if (!db.template[selectedTemplateDay]) db.template[selectedTemplateDay] = [];
    db.template[selectedTemplateDay].push({ title: '', info: '' });
    saveData();
    renderTemplateLessons();
  }

  function updateTemplateLesson(idx, field, val) {
    db.template[selectedTemplateDay][idx][field] = val;
    saveData();
  }

  function deleteTemplateLesson(idx) {
    db.template[selectedTemplateDay].splice(idx, 1);
    saveData();
    renderTemplateLessons();
  }

  function makeDayCustomIfNeeded() {
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    if (!db.lessons[key]) {
      const dayOfWeek = new Date(activeYear, activeMonth, activeDay).getDay();
      db.lessons[key] = JSON.parse(JSON.stringify(db.template[dayOfWeek] || []));
    }
  }

  function addLesson() {
    makeDayCustomIfNeeded();
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.lessons[key].push({ title: '', info: '', mark: '' });
    saveData();
    renderDayDetails();
  }

  function updateLesson(idx, field, val) {
    makeDayCustomIfNeeded();
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.lessons[key][idx][field] = val;
    saveData();
    calculateStats();
  }

  function deleteLesson(idx) {
    makeDayCustomIfNeeded();
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.lessons[key].splice(idx, 1);
    saveData();
    renderDayDetails();
  }

  function toggleSelection(item, el) {
    if (selectedItems.has(item)) {
      selectedItems.delete(item);
      el.classList.remove('selected-highlight');
    } else {
      selectedItems.add(item);
      el.classList.add('selected-highlight');
    }
  }

  function colorizeSelected() {
    if (selectedItems.size === 0) return alert("Выделите мышью блоки для заливки!");

    const color = prompt("Введите цвет HEX (#4f46e5 - синий, #10b981 - зеленый, #ef4444 - красный, #f59e0b - оранжевый):", "#4f46e5");
    if (!color) return;
    const label = prompt("Введите сноску / название периода:", "Категория");

    selectedItems.forEach(item => {
      const key = viewMode === 'seasons' ? `${activeYear}-${item}` : `${activeYear}-${activeMonth}-${item}`;
      const targetObj = viewMode === 'seasons' ? db.months : db.days;
      targetObj[key] = { color, label };
    });

    if (label) db.legend[color] = label;

    saveData();
    if (viewMode === 'seasons') renderSeasons(); else renderDays();
  }

  function calculateStats() {
    let allMarks = [];
    let subjectMap = {};

    Object.values(db.lessons).forEach(dayLessons => {
      dayLessons.forEach(l => {
        if (l.title && l.mark) {
          const val = parseFloat(l.mark);
          if (!isNaN(val)) {
            allMarks.push(val);
            if (!subjectMap[l.title]) subjectMap[l.title] = [];
            subjectMap[l.title].push(val);
          }
        }
      });
    });

    const avg = allMarks.length ? (allMarks.reduce((a,b)=>a+b, 0) / allMarks.length).toFixed(2) : '0.00';
    document.getElementById('totalAvg').innerText = avg;

    const statsContainer = document.getElementById('subjectStats');
    statsContainer.innerHTML = '';
    Object.keys(subjectMap).forEach(sub => {
      const subAvg = (subjectMap[sub].reduce((a,b)=>a+b, 0) / subjectMap[sub].length).toFixed(2);
      statsContainer.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:2px;"><span>${sub}</span><b>${subAvg}</b></div>`;
    });
  }

  function renderLegend() {
    const container = document.getElementById('legendContainer');
    container.innerHTML = '';
    Object.keys(db.legend).forEach(col => {
      container.innerHTML += `<div class="legend-tag" style="background-color:${col};"><span>${db.legend[col]}</span></div>`;
    });
  }

  function saveNotes() {
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.notes[key] = document.getElementById('dayNotes').value;
    saveData();
  }

  function handleSearch() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const container = document.getElementById('searchResults');

    if (!query) {
      container.style.display = 'none';
      if (document.getElementById('dayDetailContent').style.display !== 'none') document.getElementById('dayDetailContent').style.display = 'block';
      return;
    }

    document.getElementById('dayDetailContent').style.display = 'none';
    container.style.display = 'block';
    container.innerHTML = `<h4 style="margin-bottom:8px;">🔍 Результаты для "${query}":</h4>`;

    let found = false;
    Object.keys(db.months).forEach(k => {
      if (db.months[k].label && db.months[k].label.toLowerCase().includes(query)) {
        found = true;
        container.innerHTML += `<div style="padding:6px; background:#f0f3ff; margin-bottom:4px; border-radius:6px;"><b>Месяц:</b> ${k} — ${db.months[k].label}</div>`;
      }
    });

    Object.keys(db.days).forEach(k => {
      if (db.days[k].label && db.days[k].label.toLowerCase().includes(query)) {
        found = true;
        container.innerHTML += `<div style="padding:6px; background:#f0f3ff; margin-bottom:4px; border-radius:6px;"><b>День:</b> ${k} — ${db.days[k].label}</div>`;
      }
    });

    if (!found) container.innerHTML += `<p style="color:var(--subtext);">Ничего не найдено.</p>`;
  }

  function saveData() { localStorage.setItem('my_ultimate_diary_v4', JSON.stringify(db)); }
  function exportData() {
    const a = document.createElement('a');
    a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    a.download = `diary_backup.json`;
    a.click();
  }
  function importData() { document.getElementById('importInput').click(); }
  function processImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = function(e) {
      db = JSON.parse(e.target.result);
      saveData();
      renderSeasons();
    };
    r.readAsText(file);
  }

  renderSeasons();
</script>

</body>
</html>
