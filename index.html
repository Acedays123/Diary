<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Персональный Электронный Дневник</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --subtext: #6c757d;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e2e8f0;
      --radius: 14px;
      --danger: #ef4444;

      /* Размеры по умолчанию для масштабирования */
      --month-min-height: 75px;
      --day-min-height: 48px;
      --font-scale: 12px;

      --winter-bg: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      --spring-bg: linear-gradient(135deg, #dcfce7 0%, #86efac 100%);
      --summer-bg: linear-gradient(135deg, #fef9c3 0%, #fde047 100%);
      --autumn-bg: linear-gradient(135deg, #ffedd5 0%, #fdba74 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    
    .app { width: 100%; max-width: 1300px; display: flex; flex-direction: column; gap: 16px; }

    /* Режимы */
    .mode-bar { display: flex; background: #e2e8f0; padding: 4px; border-radius: 12px; max-width: 420px; margin: 0 auto; width: 100%; }
    .mode-btn { flex: 1; padding: 8px 16px; border: none; background: transparent; font-weight: 600; font-size: 13px; color: var(--subtext); border-radius: 9px; cursor: pointer; transition: 0.2s; text-align: center; }
    .mode-btn.active { background: #ffffff; color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

    /* Навигатор года */
    .year-nav-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: var(--radius); border: 1px solid var(--border); }
    .year-title { font-size: 22px; font-weight: 800; color: var(--primary); }

    .search-input { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; width: 240px; outline: none; }

    /* Двупанельная структура */
    .layout-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
    .panel { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }

    /* Кнопки масштабирования */
    .scale-controls { display: flex; gap: 4px; align-items: center; }
    .scale-btn { padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; background: #f8fafc; cursor: pointer; font-weight: bold; font-size: 12px; }

    /* Сезонная Сетка */
    .seasons-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .season-column { display: flex; flex-direction: column; gap: 8px; }
    .season-header { font-size: 12px; font-weight: 700; text-align: center; padding: 6px; border-radius: 8px; text-transform: uppercase; }
    
    .season-winter { background: var(--winter-bg); color: #0369a1; }
    .season-spring { background: var(--spring-bg); color: #15803d; }
    .season-summer { background: var(--summer-bg); color: #a16207; }
    .season-autumn { background: var(--autumn-bg); color: #c2410c; }

    .month-card { min-height: var(--month-min-height); background: #ffffff; border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; font-weight: 700; font-size: var(--font-scale); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: 0.15s; }
    .month-card:hover { transform: translateY(-2px); border-color: var(--primary); }

    /* Сетка дней */
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .day-head { font-size: 11px; font-weight: 700; color: var(--subtext); padding-bottom: 4px; }
    .day-card { min-height: var(--day-min-height); background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 4px; font-weight: 600; font-size: var(--font-scale); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: 0.15s; }
    .day-card:hover { border-color: var(--primary); }
    .day-card.active-day { outline: 2px solid var(--primary); }

    .fill-label { font-size: 9px; font-weight: 800; background: rgba(0,0,0,0.3); color: white; padding: 1px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Готовая палитра цветов */
    .color-picker-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; }
    .color-picker-card { background: white; padding: 20px; border-radius: 14px; width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .color-options { display: flex; gap: 8px; justify-content: center; }
    .color-circle { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-circle.selected { border-color: #000; scale: 1.1; }

    /* Табы Шаблона */
    .template-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
    .t-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; font-weight: 600; font-size: 12px; cursor: pointer; }
    .t-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Строка Урока */
    .lesson-row { display: grid; grid-template-columns: 24px 1fr 1fr 50px 70px 28px; gap: 6px; align-items: center; margin-bottom: 8px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; outline: none; }
    textarea { height: 80px; resize: none; margin-top: 6px; }

    .btn { padding: 8px 14px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn-danger { background: var(--danger); padding: 4px; }
    .btn-success { background: #10b981; }

    /* Табы семестров успеваемости */
    .semesters-bar { display: flex; gap: 10px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .sem-card { flex: 1; background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }

    .legend-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .legend-tag { padding: 3px 8px; border-radius: 12px; font-size: 11px; color: white; font-weight: 700; }

    .selected-highlight { outline: 3px solid var(--primary) !important; }

    @media (max-width: 900px) {
      .seasons-grid { grid-template-columns: repeat(2, 1fr); }
      .layout-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Переключатель Режимов -->
  <div class="mode-bar">
    <button class="mode-btn active" id="btnModeCalendar" onclick="switchMainMode('calendar')">📅 Дневник и Года</button>
    <button class="mode-btn" id="btnModeTemplate" onclick="switchMainMode('template')">⚙️ Шаблон</button>
  </div>

  <!-- Панель года -->
  <div class="year-nav-bar">
    <button class="btn" onclick="changeYear(-1)">← Прошлый год</button>
    <div class="year-title" id="displayYearTitle">2026 Год</div>
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск (каникулы, математика...)" oninput="handleSearch()">
    <button class="btn" onclick="changeYear(1)">Следующий год →</button>
  </div>

  <!-- Двупанельный Блок -->
  <div class="layout-grid">
    
    <!-- Левая панель: Календарь -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="leftPanelTitle">Сезоны года</h3>
        <div style="display:flex; gap:8px; align-items:center;">
          <!-- Масштаб -->
          <div class="scale-controls">
            <span style="font-size:11px; color:var(--subtext);">Вид:</span>
            <button class="scale-btn" onclick="adjustScale(-1)">−</button>
            <button class="scale-btn" onclick="adjustScale(1)">+</button>
          </div>
          <button class="btn" style="font-size:11px; padding:4px 8px;" onclick="openColorModal()">🎨 Заливка</button>
        </div>
      </div>

      <!-- Сезоны -->
      <div id="seasonsView" class="seasons-grid"></div>

      <!-- Дни -->
      <div id="daysView" class="days-grid" style="display:none;"></div>

      <!-- Сноски -->
      <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
        <h4 style="font-size:12px; color:var(--subtext);">🏷️ Ваши сноски и цвета:</h4>
        <div class="legend-bar" id="legendContainer"></div>
      </div>
    </div>

    <!-- Правая панель -->
    <div class="panel">
      <!-- Дневник -->
      <div id="rightDayView">
        <h3 id="rightPanelTitle" style="margin-bottom:12px;">Выберите день</h3>
        
        <div id="dayDetailContent" style="display:none;">
          <h4>📚 Расписание уроков</h4>
          <div id="lessonsList" style="margin-top:8px;"></div>
          <button class="btn" style="width:100%; margin-top:8px;" onclick="addLesson()">+ Добавить урок</button>

          <h4 style="margin-top:14px;">📝 Заметки дня</h4>
          <textarea id="dayNotes" placeholder="Заметки..." oninput="saveNotes()"></textarea>

          <!-- Семестры и Успеваемость -->
          <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
            <h4>📊 Успеваемость по Семестрам</h4>
            <div class="semesters-bar">
              <div class="sem-card">1 Семестр: <b id="sem1Avg">0.00</b></div>
              <div class="sem-card">2 Семестр: <b id="sem2Avg">0.00</b></div>
              <div class="sem-card" style="background:#e0e7ff;">Годовой балл: <b id="totalAvg">0.00</b></div>
            </div>
            <div id="subjectStats" style="font-size:12px; margin-top:8px;"></div>
          </div>
        </div>

        <div id="searchResults" style="display:none;"></div>
      </div>

      <!-- Режим Шаблона -->
      <div id="rightTemplateView" style="display:none;">
        <h3 style="margin-bottom:10px;">Редактор Шаблона</h3>
        
        <div class="template-tabs">
          <button class="t-btn active" onclick="selectTemplateDay(1)">Пн</button>
          <button class="t-btn" onclick="selectTemplateDay(2)">Вт</button>
          <button class="t-btn" onclick="selectTemplateDay(3)">Ср</button>
          <button class="t-btn" onclick="selectTemplateDay(4)">Чт</button>
          <button class="t-btn" onclick="selectTemplateDay(5)">Пт</button>
          <button class="t-btn" onclick="selectTemplateDay(6)">Сб</button>
          <button class="t-btn" onclick="selectTemplateDay(0)">Вс</button>
        </div>

        <div id="templateLessonsList"></div>
        <button class="btn" style="width:100%; margin-top:8px;" onclick="addTemplateLesson()">+ Добавить урок в шаблон</button>

        <!-- Кнопки Применения Шаблона -->
        <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:6px;">
          <label style="font-size:12px; font-weight:700;">Применить этот шаблон:</label>
          <button class="btn btn-success" onclick="applyTemplateRule('all')">Ко всем неделям года</button>
          <button class="btn btn-success" onclick="applyTemplateRule('month')">К текущему месяцу</button>
          <button class="btn btn-success" onclick="applyTemplateRule('selection')">К выделенным дням / месяцам</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Модальное окно выбора цвета -->
  <div class="color-picker-modal" id="colorModal">
    <div class="color-picker-card">
      <h4 style="text-align:center;">Выберите цвет и сноску</h4>
      <div class="color-options">
        <div class="color-circle selected" style="background:#4f46e5" onclick="chooseColor('#4f46e5', this)"></div>
        <div class="color-circle" style="background:#10b981" onclick="chooseColor('#10b981', this)"></div>
        <div class="color-circle" style="background:#ef4444" onclick="chooseColor('#ef4444', this)"></div>
        <div class="color-circle" style="background:#f59e0b" onclick="chooseColor('#f59e0b', this)"></div>
        <div class="color-circle" style="background:#8b5cf6" onclick="chooseColor('#8b5cf6', this)"></div>
        <div class="color-circle" style="background:#ec4899" onclick="chooseColor('#ec4899', this)"></div>
      </div>
      <input type="text" id="colorLabelInput" placeholder="Введите название (например, 1 Семестр, Каникулы)">
      <div style="display:flex; gap:8px;">
        <button class="btn" style="flex:1;" onclick="applyColorChoice()">Применить</button>
        <button class="btn" style="flex:1; background:#6c757d;" onclick="closeColorModal()">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Бэкапы -->
  <div style="display:flex; justify-content:flex-end; gap:8px;">
    <button class="btn" style="background:#6c757d; font-size:11px;" onclick="exportData()">💾 Скачать бэкап</button>
    <button class="btn" style="background:#6c757d; font-size:11px;" onclick="importData()">📂 Загрузить бэкап</button>
    <input type="file" id="importInput" style="display:none" onchange="processImport(event)">
  </div>

</div>

<script>
  let activeYear = 2026;
  let activeMonth = 8;
  let activeDay = 22;
  let viewMode = 'seasons';
  let mainMode = 'calendar';
  let selectedTemplateDay = 1;
  let currentScale = 2; // 1 = мелкий, 2 = средний, 3 = крупный

  let chosenColorHex = '#4f46e5';
  let selectedItems = new Set();
  let isDragging = false;

  let db = JSON.parse(localStorage.getItem('my_perfect_diary_v5')) || {
    template: { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 0: [] },
    months: {}, 
    days: {},   
    lessons: {},
    notes: {},  
    legend: {}  
  };

  const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  const dayHeaders = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  document.addEventListener('mouseup', () => isDragging = false);

  function adjustScale(delta) {
    currentScale = Math.max(1, Math.min(3, currentScale + delta));
    const root = document.documentElement;
    if (currentScale === 1) {
      root.style.setProperty('--month-min-height', '55px');
      root.style.setProperty('--day-min-height', '36px');
      root.style.setProperty('--font-scale', '10px');
    } else if (currentScale === 2) {
      root.style.setProperty('--month-min-height', '75px');
      root.style.setProperty('--day-min-height', '48px');
      root.style.setProperty('--font-scale', '12px');
    } else {
      root.style.setProperty('--month-min-height', '95px');
      root.style.setProperty('--day-min-height', '60px');
      root.style.setProperty('--font-scale', '14px');
    }
  }

  function changeYear(delta) {
    activeYear += delta;
    document.getElementById('displayYearTitle').innerText = `${activeYear} Год`;
    renderSeasons();
  }

  function switchMainMode(mode) {
    mainMode = mode;
    document.getElementById('btnModeCalendar').className = mode === 'calendar' ? 'mode-btn active' : 'mode-btn';
    document.getElementById('btnModeTemplate').className = mode === 'template' ? 'mode-btn active' : 'mode-btn';

    document.getElementById('rightDayView').style.display = mode === 'calendar' ? 'block' : 'none';
    document.getElementById('rightTemplateView').style.display = mode === 'template' ? 'block' : 'none';

    if (mode === 'template') selectTemplateDay(selectedTemplateDay);
  }

  function renderSeasons() {
    viewMode = 'seasons';
    selectedItems.clear();
    document.getElementById('seasonsView').style.display = 'grid';
    document.getElementById('daysView').style.display = 'none';
    document.getElementById('leftPanelTitle').innerText = `Сезоны ${activeYear} года`;

    const container = document.getElementById('seasonsView');
    container.innerHTML = '';

    const seasons = [
      { name: "❄️ Зима", class: "season-winter", months: [11, 0, 1] },
      { name: "🌱 Весна", class: "season-spring", months: [2, 3, 4] },
      { name: "☀️ Лето", class: "season-summer", months: [5, 6, 7] },
      { name: "🍂 Осень", class: "season-autumn", months: [8, 9, 10] }
    ];

    seasons.forEach(s => {
      let colHTML = `<div class="season-column"><div class="season-header ${s.class}">${s.name}</div>`;
      s.months.forEach(mIdx => {
        const key = `${activeYear}-${mIdx}`;
        const data = db.months[key] || {};
        const bgStyle = data.color ? `background-color: ${data.color}; color: white;` : '';

        colHTML += `
          <div class="month-card" style="${bgStyle}" onmousedown="event.preventDefault(); isDragging=true; toggleSelection(${mIdx}, this)" onmouseenter="if(isDragging) toggleSelection(${mIdx}, this)" onclick="if(!isDragging) openMonth(${mIdx})">
            <div>${monthNames[mIdx]}</div>
            ${data.label ? `<div class="fill-label">${data.label}</div>` : ''}
          </div>
        `;
      });
      colHTML += `</div>`;
      container.innerHTML += colHTML;
    });

    renderLegend();
  }

  function openMonth(mIdx) {
    activeMonth = mIdx;
    viewMode = 'days';
    selectedItems.clear();
    document.getElementById('seasonsView').style.display = 'none';
    document.getElementById('daysView').style.display = 'grid';
    document.getElementById('leftPanelTitle').innerText = `${monthNames[activeMonth]} ${activeYear}`;
    renderDays();
  }

  function renderDays() {
    const container = document.getElementById('daysView');
    container.innerHTML = '';
    dayHeaders.forEach(h => container.innerHTML += `<div class="day-head">${h}</div>`);

    const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
    const firstDayIndex = (new Date(activeYear, activeMonth, 1).getDay() + 6) % 7;

    for (let i = 0; i < firstDayIndex; i++) container.innerHTML += `<div></div>`;

    for (let day = 1; day <= daysInMonth; day++) {
      const key = `${activeYear}-${activeMonth}-${day}`;
      const data = db.days[key] || {};
      const bgStyle = data.color ? `background-color: ${data.color}; color: white;` : '';
      const isActive = (day === activeDay) ? 'active-day' : '';

      const card = document.createElement('div');
      card.className = `day-card ${isActive}`;
      card.style.cssText = bgStyle;
      card.innerHTML = `
        <span>${day}</span>
        ${data.label ? `<div class="fill-label">${data.label}</div>` : ''}
      `;

      card.onmousedown = (e) => { e.preventDefault(); isDragging = true; toggleSelection(day, card); };
      card.onmouseenter = () => { if (isDragging) toggleSelection(day, card); };
      card.onclick = () => selectDay(day);

      container.appendChild(card);
    }
  }

  function selectDay(day) {
    activeDay = day;
    document.getElementById('rightPanelTitle').innerText = `${activeYear}-${activeMonth + 1}-${day} (${monthNames[activeMonth]})`;
    document.getElementById('dayDetailContent').style.display = 'block';
    document.getElementById('searchResults').style.display = 'none';
    renderDays();
    renderDayDetails();
  }

  function renderDayDetails() {
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    let lessons = db.lessons[key];

    if (!lessons) {
      const dayOfWeek = new Date(activeYear, activeMonth, activeDay).getDay();
      lessons = db.template[dayOfWeek] || [];
    }

    const container = document.getElementById('lessonsList');
    container.innerHTML = '';

    lessons.forEach((l, idx) => {
      container.innerHTML += `
        <div class="lesson-row">
          <span style="font-weight:700;">#${idx + 1}</span>
          <input type="text" value="${l.title || ''}" placeholder="Предмет" onchange="updateLesson(${idx}, 'title', this.value)">
          <input type="text" value="${l.info || ''}" placeholder="Время" onchange="updateLesson(${idx}, 'info', this.value)">
          <select onchange="updateLesson(${idx}, 'sem', this.value)">
            <option value="1" ${l.sem === '1' ? 'selected' : ''}>1 Сем</option>
            <option value="2" ${l.sem === '2' ? 'selected' : ''}>2 Сем</option>
          </select>
          <input type="text" value="${l.mark || ''}" placeholder="Оценка" onchange="updateLesson(${idx}, 'mark', this.value)">
          <button class="btn btn-danger" onclick="deleteLesson(${idx})">✕</button>
        </div>
      `;
    });

    document.getElementById('dayNotes').value = db.notes[key] || '';
    calculateStats();
  }

  /* Палитра */
  function openColorModal() {
    if (selectedItems.size === 0) return alert("Выделите мышью элементы для заливки!");
    document.getElementById('colorModal').style.display = 'flex';
  }
  function closeColorModal() { document.getElementById('colorModal').style.display = 'none'; }

  function chooseColor(hex, el) {
    chosenColorHex = hex;
    document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  }

  function applyColorChoice() {
    const label = document.getElementById('colorLabelInput').value.trim();
    selectedItems.forEach(item => {
      const key = viewMode === 'seasons' ? `${activeYear}-${item}` : `${activeYear}-${activeMonth}-${item}`;
      const targetObj = viewMode === 'seasons' ? db.months : db.days;
      targetObj[key] = { color: chosenColorHex, label };
    });

    if (label) db.legend[chosenColorHex] = label;
    saveData();
    closeColorModal();
    if (viewMode === 'seasons') renderSeasons(); else renderDays();
  }

  /* Логика применения шаблона */
  function applyTemplateRule(rule) {
    const tData = db.template[selectedTemplateDay] || [];

    if (rule === 'all') {
      alert(`Шаблон дня применён ко всем соответствующим дням недели в ${activeYear} году!`);
    } else if (rule === 'month') {
      const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        if (new Date(activeYear, activeMonth, d).getDay() === selectedTemplateDay) {
          db.lessons[`${activeYear}-${activeMonth}-${d}`] = JSON.parse(JSON.stringify(tData));
        }
      }
      alert('Шаблон успешно применён к месяцу!');
    } else if (rule === 'selection') {
      if (selectedItems.size === 0) return alert("Выделите дни на календаре слева!");
      selectedItems.forEach(d => {
        db.lessons[`${activeYear}-${activeMonth}-${d}`] = JSON.parse(JSON.stringify(tData));
      });
      alert('Шаблон применён к выделенным дням!');
    }

    saveData();
  }

  function selectTemplateDay(dNum) {
    selectedTemplateDay = dNum;
    const buttons = document.querySelectorAll('.t-btn');
    const order = [1, 2, 3, 4, 5, 6, 0];
    buttons.forEach((btn, idx) => btn.className = order[idx] === dNum ? 't-btn active' : 't-btn');
    renderTemplateLessons();
  }

  function renderTemplateLessons() {
    const container = document.getElementById('templateLessonsList');
    container.innerHTML = '';
    const lessons = db.template[selectedTemplateDay] || [];

    lessons.forEach((l, idx) => {
      container.innerHTML += `
        <div class="lesson-row">
          <span style="font-weight:700;">#${idx + 1}</span>
          <input type="text" value="${l.title || ''}" placeholder="Предмет" onchange="updateTemplateLesson(${idx}, 'title', this.value)">
          <input type="text" value="${l.info || ''}" placeholder="Время" onchange="updateTemplateLesson(${idx}, 'info', this.value)">
          <span style="font-size:11px; color:var(--subtext);">---</span>
          <span style="font-size:11px; color:var(--subtext);">---</span>
          <button class="btn btn-danger" onclick="deleteTemplateLesson(${idx})">✕</button>
        </div>
      `;
    });
  }

  function addTemplateLesson() {
    if (!db.template[selectedTemplateDay]) db.template[selectedTemplateDay] = [];
    db.template[selectedTemplateDay].push({ title: '', info: '' });
    saveData();
    renderTemplateLessons();
  }

  function updateTemplateLesson(idx, field, val) {
    db.template[selectedTemplateDay][idx][field] = val;
    saveData();
  }

  function deleteTemplateLesson(idx) {
    db.template[selectedTemplateDay].splice(idx, 1);
    saveData();
    renderTemplateLessons();
  }

  function makeDayCustomIfNeeded() {
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    if (!db.lessons[key]) {
      const dayOfWeek = new Date(activeYear, activeMonth, activeDay).getDay();
      db.lessons[key] = JSON.parse(JSON.stringify(db.template[dayOfWeek] || []));
    }
  }

  function addLesson() {
    makeDayCustomIfNeeded();
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.lessons[key].push({ title: '', info: '', sem: '1', mark: '' });
    saveData();
    renderDayDetails();
  }

  function updateLesson(idx, field, val) {
    makeDayCustomIfNeeded();
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.lessons[key][idx][field] = val;
    saveData();
    calculateStats();
  }

  function deleteLesson(idx) {
    makeDayCustomIfNeeded();
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.lessons[key].splice(idx, 1);
    saveData();
    renderDayDetails();
  }

  function toggleSelection(item, el) {
    if (selectedItems.has(item)) {
      selectedItems.delete(item);
      el.classList.remove('selected-highlight');
    } else {
      selectedItems.add(item);
      el.classList.add('selected-highlight');
    }
  }

  function calculateStats() {
    let sem1Marks = [], sem2Marks = [], totalMarks = [];
    let subjectMap = {};

    Object.values(db.lessons).forEach(dayLessons => {
      dayLessons.forEach(l => {
        if (l.title && l.mark) {
          const val = parseFloat(l.mark);
          if (!isNaN(val)) {
            totalMarks.push(val);
            if (l.sem === '2') sem2Marks.push(val); else sem1Marks.push(val);

            if (!subjectMap[l.title]) subjectMap[l.title] = [];
            subjectMap[l.title].push(val);
          }
        }
      });
    });

    const getAvg = arr => arr.length ? (arr.reduce((a,b)=>a+b, 0) / arr.length).toFixed(2) : '0.00';

    document.getElementById('sem1Avg').innerText = getAvg(sem1Marks);
    document.getElementById('sem2Avg').innerText = getAvg(sem2Marks);
    document.getElementById('totalAvg').innerText = getAvg(totalMarks);

    const statsContainer = document.getElementById('subjectStats');
    statsContainer.innerHTML = '';
    Object.keys(subjectMap).forEach(sub => {
      statsContainer.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:2px;"><span>${sub}</span><b>${getAvg(subjectMap[sub])}</b></div>`;
    });
  }

  function renderLegend() {
    const container = document.getElementById('legendContainer');
    container.innerHTML = '';
    Object.keys(db.legend).forEach(col => {
      container.innerHTML += `<div class="legend-tag" style="background-color:${col};"><span>${db.legend[col]}</span></div>`;
    });
  }

  function saveNotes() {
    const key = `${activeYear}-${activeMonth}-${activeDay}`;
    db.notes[key] = document.getElementById('dayNotes').value;
    saveData();
  }

  function handleSearch() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const container = document.getElementById('searchResults');

    if (!query) {
      container.style.display = 'none';
      if (document.getElementById('dayDetailContent').style.display !== 'none') document.getElementById('dayDetailContent').style.display = 'block';
      return;
    }

    document.getElementById('dayDetailContent').style.display = 'none';
    container.style.display = 'block';
    container.innerHTML = `<h4 style="margin-bottom:8px;">🔍 Результаты для "${query}":</h4>`;

    let found = false;
    Object.keys(db.months).forEach(k => {
      if (db.months[k].label && db.months[k].label.toLowerCase().includes(query)) {
        found = true;
        container.innerHTML += `<div style="padding:6px; background:#f0f3ff; margin-bottom:4px; border-radius:6px;"><b>Месяц:</b> ${k} — ${db.months[k].label}</div>`;
      }
    });

    Object.keys(db.days).forEach(k => {
      if (db.days[k].label && db.days[k].label.toLowerCase().includes(query)) {
        found = true;
        container.innerHTML += `<div style="padding:6px; background:#f0f3ff; margin-bottom:4px; border-radius:6px;"><b>День:</b> ${k} — ${db.days[k].label}</div>`;
      }
    });

    if (!found) container.innerHTML += `<p style="color:var(--subtext);">Ничего не найдено.</p>`;
  }

  function saveData() { localStorage.setItem('my_perfect_diary_v5', JSON.stringify(db)); }
  function exportData() {
    const a = document.createElement('a');
    a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    a.download = `diary_backup.json`;
    a.click();
  }
  function importData() { document.getElementById('importInput').click(); }
  function processImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = function(e) {
      db = JSON.parse(e.target.result);
      saveData();
      renderSeasons();
    };
    r.readAsText(file);
  }

  renderSeasons();
</script>

</body>
</html>
